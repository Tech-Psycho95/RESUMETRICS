# Unit tests and a production build on every push and pull request.
# Public repo: standard GitHub runners are free with unlimited minutes. No secrets are used;
# AI calls in tests are mocked or local, so this never spends the Groq quota.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install exactly what package-lock.json lists
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
